[project]
name = "ai-briefing"
version = "0.1.0"
description = "Personal AI/tech industry morning briefing"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
ai-briefing = "ai_briefing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_briefing"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
